name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oku
          POSTGRES_PASSWORD: oku
          POSTGRES_DB: oku_24_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oku -d oku_24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Тестовая база в контейнере CI. Имя должно оканчиваться на _test:
      # интеграционные тесты очищают таблицы и на другой базе не запустятся.
      DATABASE_URL: postgresql://oku:oku@localhost:5432/oku_24_test?schema=public
      DIRECT_URL: postgresql://oku:oku@localhost:5432/oku_24_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to a clean database
        run: pnpm db:migrate:deploy

      - name: Check that migrations match the schema
        run: pnpm db:drift

      - name: Integration and e2e tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
