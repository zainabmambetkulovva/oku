packages:
  - 'apps/*'
  - 'packages/*'

# Зависимости, которым разрешено выполнять install-скрипты.
# prisma/@prisma/* скачивают движки, bcrypt собирает нативный модуль.
# @nestjs/core содержит только рекламный postinstall (opencollective) — не нужен.
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true

# Исправленные версии вложенных зависимостей (pnpm audit, этап 10).
# Основные версии фреймворков не меняются — только патчи внутри тех же мажорных версий.
overrides:
  body-parser@1: ^1.20.9
  qs: ^6.16.1
  multer@2: ^2.5.0
  lodash: ^4.18.1
  js-yaml@4: ^4.3.2
  postcss: ^8.5.23
  minimatch@9: ^9.0.7
  picomatch@4: ^4.0.4
  tmp: ^0.2.6
  glob@10: ^10.5.0
  ajv@8: ^8.18.0
  webpack@5: ^5.104.1
