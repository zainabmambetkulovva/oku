packages:
  - "apps/*"
  - "packages/*"

# Зависимости, которым разрешено выполнять install-скрипты.
# prisma/@prisma/* скачивают движки, bcrypt собирает нативный модуль.
# @nestjs/core содержит только рекламный postinstall (opencollective) — не нужен.
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
