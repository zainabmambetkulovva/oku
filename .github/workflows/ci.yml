name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oku
          POSTGRES_PASSWORD: oku
          POSTGRES_DB: oku_24_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oku -d oku_24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Тестовая база в контейнере CI. Имя должно оканчиваться на _test:
      # интеграционные тесты очищают таблицы и на другой базе не запустятся.
      DATABASE_URL: postgresql://oku:oku@localhost:5432/oku_24_test?schema=public
      DIRECT_URL: postgresql://oku:oku@localhost:5432/oku_24_test?schema=public
      REDIS_URL: redis://localhost:6379
      # S3-совместимое хранилище SeaweedFS (запускается отдельным шагом, как в docker-compose)
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY_ID: oku-s3-key
      S3_SECRET_ACCESS_KEY: oku-s3-secret
      S3_PUBLIC_BUCKET: oku-24-public
      S3_PRIVATE_BUCKET: oku-24-private
      S3_FORCE_PATH_STYLE: 'true'
      MEDIA_PUBLIC_BASE_URL: http://localhost:8333/oku-24-public
      # Frontend: адрес API встраивается в клиентский код при сборке
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      API_URL: http://localhost:3000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to a clean database
        run: pnpm db:migrate:deploy

      - name: Check that migrations match the schema
        run: pnpm db:drift

      # Сервисы GitHub Actions не позволяют задать команду контейнера, поэтому — docker run
      - name: Start S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.50 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8333/ && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1

      - name: Integration and e2e tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # ── Сквозные проверки frontend: API + web + браузер ──────────────────────
      - name: Seed demo catalog (with generated audio)
        env:
          # Учётные записи для e2e админки (только в CI, не секреты)
          SEED_ADMIN_EMAIL: admin@e2e.oku24.kg
          SEED_ADMIN_PASSWORD: E2eAdmin123
          SEED_USER_EMAIL: reader@e2e.oku24.kg
          SEED_USER_PASSWORD: E2eReader123
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          # Чистая база: после интеграционных тестов в ней остаются их данные
          pnpm --filter @oku_24/api exec prisma migrate reset --force --skip-seed
          pnpm db:seed

      - name: Start API and web
        env:
          JWT_SECRET: ci-e2e-secret
          CORS_ORIGINS: http://localhost:3001
          # Без кэша: каталог только что заполнен seed
          REDIS_URL: ''
          # e2e входят в админку много раз подряд с одного адреса
          AUTH_THROTTLE_LIMIT: '200'
          # Служебный ключ web → API: запросы серверной отрисовки не упираются в общий
          # лимит (100 в минуту). Тестовое значение, не секрет
          INTERNAL_API_TOKEN: ci-internal-token-not-a-secret-0123456789
        run: |
          (cd apps/api && PORT=3000 node dist/main > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/health >/dev/null && curl -sf -o /dev/null http://localhost:3001/ru && exit 0
            sleep 2
          done
          cat api.log web.log
          exit 1

      - name: Install Playwright browser
        run: pnpm --filter @oku_24/web exec playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        env:
          SEED_ADMIN_EMAIL: admin@e2e.oku24.kg
          SEED_ADMIN_PASSWORD: E2eAdmin123
          SEED_USER_EMAIL: reader@e2e.oku24.kg
          SEED_USER_PASSWORD: E2eReader123
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            api.log
            web.log
          retention-days: 7
