# Локальное окружение для разработки: PostgreSQL, Redis и S3-совместимое хранилище.
# Запуск из корня репозитория: pnpm docker:up
# Учётные данные ниже — только для локальной разработки, не для production.
name: oku_24

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oku
      POSTGRES_PASSWORD: oku
      POSTGRES_DB: oku_24_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oku -d oku_24_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-совместимое хранилище (SeaweedFS) вместо S3 в разработке: http://localhost:8333
  # Учётные данные и права — docker/seaweedfs/s3.json (только для разработки):
  #  - бакет oku-24-public (обложки) читается без авторизации, как через CDN;
  #  - бакет oku-24-private (аудиофайлы) закрыт, файлы выдаются по подписанным ссылкам.
  # Бакеты создаёт backend при старте, если S3_CREATE_BUCKETS=true.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
